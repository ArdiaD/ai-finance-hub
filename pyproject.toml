[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifinhub"
version = "0.1.0"
description = "AI & Finance Paper Hub — discovery, curation, and publishing pipeline"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8",
    "rapidfuzz>=3.0",
    "Jinja2>=3.1",
    "rich>=13.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
scholar = ["google-search-results>=2.4", "scholarly>=1.7"]

[project.scripts]
aifinhub = "aifinhub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
