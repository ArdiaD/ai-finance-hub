# ───────────────────────────────────────────────────────────────────────────
# AI & Finance Paper Hub — configuration
# ───────────────────────────────────────────────────────────────────────────

hub:
  title: "AI & Finance Paper Hub"
  subtitle: "Curated research on AI for trading & investment"
  # Used in the site footer / LinkedIn post. Edit to your handle/site.
  curator: "David Ardia"
  site_url: "https://fame-ai.org"

# How far back each source looks on a normal weekly run.
fetch:
  lookback_days: 10          # small overlap with the 7-day cadence avoids gaps
  max_results_per_source: 80

# ───────────────────────────────────────────────────────────────────────────
# Relevance filtering
#
# An item is kept if it matches >=1 "ai" term AND >=1 "finance" term in its
# title/abstract (cheap pre-filter), then scored. Optionally re-scored by an LLM.
# ───────────────────────────────────────────────────────────────────────────
relevance:
  min_score: 2               # keyword score threshold to enter the inbox
  use_llm: false             # set true to re-rank with Claude (needs ANTHROPIC_API_KEY)
  llm_model: "claude-opus-4-8"

  ai_terms:
    - machine learning
    - deep learning
    - neural network
    - reinforcement learning
    - large language model
    - "LLM"
    - transformer
    - natural language processing
    - "NLP"
    - artificial intelligence
    - generative
    - "GPT"
    - embedding
    - gradient boosting
    - random forest
    - graph neural

  finance_terms:
    - trading
    - investment
    - portfolio
    - asset pricing
    - stock return
    - equity
    - market
    - alpha
    - factor
    - volatility
    - risk
    - hedge
    - derivative
    - cryptocurrency
    - forecasting return
    - backtest
    - order book
    - execution

# ───────────────────────────────────────────────────────────────────────────
# Themes — keyword-based topics auto-assigned to each paper (a paper can match
# several). Surfaced as a column in the Excel review and as filter chips on the
# website. Matching is case-insensitive substring over the title + abstract.
# Edit freely; run `python -m aifinhub retag` to re-apply to existing papers.
# ───────────────────────────────────────────────────────────────────────────
themes:
  "LLMs & Generative AI": [large language model, "LLM", "GPT", generative, transformer, chatbot, foundation model]
  "Reinforcement Learning": [reinforcement learning, deep rl, q-learning, policy gradient, actor-critic, agentic]
  "Deep Learning": [deep learning, neural network, lstm, cnn, attention, autoencoder, graph neural]
  "NLP & Sentiment": [sentiment, natural language, text mining, news, embedding, topic model, "NLP"]
  "Portfolio & Allocation": [portfolio, asset allocation, mean-variance, diversification, rebalanc, weight]
  "Factor Investing": [factor, anomaly, cross-section, characteristic, smart beta, style]
  "Return Forecasting": [return prediction, return forecast, predictability, expected return, stock return]
  "Volatility & Risk": [volatility, value-at-risk, "VaR", tail risk, drawdown, covariance, risk management]
  "Trading & Execution": [trading strateg, execution, order book, market making, high-frequency, limit order, microstructure]
  "Cryptocurrency": [crypto, bitcoin, blockchain, "defi", digital asset, token]
  "Derivatives & Options": [option, derivative, futures, hedging, implied volatility]
  "Macro & Forecasting": [macroeconomic, recession, inflation, gdp, business cycle, nowcast]

# ───────────────────────────────────────────────────────────────────────────
# Sources. Disable any by setting `enabled: false`.
# ───────────────────────────────────────────────────────────────────────────
sources:
  arxiv:
    enabled: true
    categories: [q-fin.TR, q-fin.PM, q-fin.CP, q-fin.ST, q-fin.GN, cs.LG, cs.CE]

  repec:
    enabled: true
    # NEP (New Economics Papers) report codes most relevant to AI x finance.
    nep_reports: [nep-fmk, nep-cmp, nep-big, nep-rmg, nep-fin]

  ssrn:
    enabled: true
    # Best-effort: SSRN has no official API. Networks = topic networks to search.
    queries: ["machine learning trading", "deep learning portfolio", "LLM finance"]

  journals:
    enabled: false             # superseded by the OpenAlex venue source below
    feeds:
      "Journal of Finance": "https://onlinelibrary.wiley.com/feed/15406261/most-recent"

  # OpenAlex venue source — targeted AI-in-finance papers from curated journals.
  # finance/quant venues are searched for AI terms; ML/AI venues for finance terms.
  # The AI×finance relevance gate refines further. Source IDs are OpenAlex's.
  openalex:
    enabled: true
    ai_search: "machine learning|deep learning|reinforcement learning|neural network|artificial intelligence|large language model|transformer|natural language processing|graph neural"
    finance_search: "trading|investment|portfolio|stock return|asset pricing|equity|volatility|financial market|cryptocurrency|hedging|credit risk|stock price"
    finance_venues:   # Tier 1-3: dedicated AI-finance, quant, and top finance journals
      "Journal of Financial Data Science": S4210236412
      "Journal of Finance and Data Science": S2898431940
      "Digital Finance": S4210211077
      "Financial Innovation": S3034727917
      "Algorithmic Finance": S4210198154
      "Quantitative Finance": S182689569
      "Journal of Portfolio Management": S143806524
      "Financial Analysts Journal": S162525099
      "Journal of Financial Econometrics": S207154782
      "Journal of Financial Markets": S127646213
      "Journal of Empirical Finance": S145875555
      "Journal of Investment Strategies": S4210195752
      "Journal of Computational Finance": S165973286
      "Journal of Finance": S5353659
      "Review of Financial Studies": S170137484
      "Journal of Financial Economics": S149240962
      "Journal of Financial and Quantitative Analysis": S193228710
      "Management Science": S33323087
      "Review of Asset Pricing Studies": S2735409286
    ai_venues:        # Tier 4: ML/AI journals that publish finance applications
      "Expert Systems with Applications": S13144211
      "Knowledge-Based Systems": S10169007
      "Neurocomputing": S45693802
      "Applied Soft Computing": S140556538
      "Decision Support Systems": S11479521
      "Machine Learning": S62148650
      "Neural Networks": S123019304
      "IEEE Transactions on Neural Networks and Learning Systems": S4210175523
      "Journal of Machine Learning Research": S118988714

  scholar:
    enabled: false             # off by default: no API, bot-blocked. See docs.
    queries: ["machine learning stock return prediction", "deep reinforcement learning trading"]
    # Backend: "serpapi" (reliable, needs SERPAPI_KEY) or "scholarly" (free, fragile)
    backend: serpapi
